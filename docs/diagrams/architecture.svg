<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="-apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif">
  <!-- Engineered by uncoalesced. System architecture. Source of truth: docs/ARCHITECTURE.md -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8e8e93"/>
    </marker>
    <style>
      .t { font-size: 19px; font-weight: 650; fill: #1d1d1f; }
      .s { font-size: 14px; fill: #48484a; }
      .m { font-size: 12.5px; fill: #6e6e73; font-family: ui-monospace, 'SF Mono', Consolas, monospace; }
      .lab { font-size: 13px; fill: #3a3a3c; font-weight: 550; }
      .grp { font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      .audio { fill: #e6f6f4; stroke: #0f8a7e; stroke-width: 1.6; }
      .core { fill: #eceefe; stroke: #4c51bf; stroke-width: 1.6; }
      .out { fill: #f2f2f7; stroke: #8e8e93; stroke-width: 1.4; }
      .ln { stroke: #3a3a3c; stroke-width: 2; fill: none; }
      .lg { stroke: #8e8e93; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="40" y="58" font-size="30" font-weight="700" fill="#1d1d1f">Chakravyuh: system architecture</text>
  <text x="40" y="88" class="s" font-size="16">One local machine runs the whole loop: speech in, persona reply out, captured details to a report. No call audio is stored.</text>

  <!-- ===== audio in (Jammy) ===== -->
  <text x="40" y="168" class="grp" fill="#0f8a7e">AUDIO IN</text>
  <rect x="40" y="185" width="240" height="140" rx="14" class="audio"/>
  <text x="60" y="218" class="t">Call line</text>
  <text x="60" y="244" class="s">Virtual caller (WebSocket)</text>
  <text x="60" y="264" class="s">Phone bridge · WAV replay</text>
  <text x="60" y="300" class="m">16 kHz PCM · 20 ms frames</text>

  <rect x="330" y="185" width="250" height="140" rx="14" class="audio"/>
  <text x="350" y="218" class="t">Silero VAD</text>
  <text x="350" y="244" class="s">Speech start → barge-in</text>
  <text x="350" y="264" class="s">600 ms silence → end of turn</text>
  <text x="350" y="300" class="m">ONNX · ~6 ms per audio s</text>

  <rect x="630" y="185" width="250" height="140" rx="14" class="audio"/>
  <text x="650" y="218" class="t">faster-whisper</text>
  <text x="650" y="244" class="s">Speech to text, one final</text>
  <text x="650" y="264" class="s">transcript per caller turn</text>
  <text x="650" y="300" class="m">filler starts at endpoint</text>

  <path d="M280 255 H322" class="ln" marker-end="url(#a)"/>
  <path d="M580 255 H622" class="ln" marker-end="url(#a)"/>
  <text x="586" y="242" class="lab">utterance</text>

  <!-- ===== core (Joel) ===== -->
  <rect x="930" y="150" width="380" height="520" rx="20" fill="none" stroke="#4c51bf" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="952" y="178" class="grp" fill="#4c51bf">CORE</text>

  <rect x="950" y="195" width="340" height="140" rx="14" class="core"/>
  <text x="970" y="228" class="t">Persona state machine</text>
  <text x="970" y="254" class="s">PANIC → STALLING → BAITING</text>
  <text x="970" y="274" class="s">→ EXTRACTING → WRAPUP</text>
  <text x="970" y="310" class="m">decides intent, deterministic</text>

  <rect x="950" y="355" width="340" height="125" rx="14" class="core"/>
  <text x="970" y="388" class="t">Local LLM (Ollama)</text>
  <text x="970" y="414" class="s">Words the line only. Filtered;</text>
  <text x="970" y="434" class="s">scripted fallback on any failure</text>
  <text x="970" y="464" class="m">sentence streaming</text>

  <rect x="950" y="500" width="340" height="150" rx="14" class="core"/>
  <text x="970" y="533" class="t">Extraction engine</text>
  <text x="970" y="559" class="s">UPI · account · IFSC · phone · link</text>
  <text x="970" y="579" class="s">incl. spoken digits and "at the rate"</text>
  <text x="970" y="615" class="m">format checks only</text>
  <text x="970" y="633" class="m">never "verified"</text>

  <path d="M1120 335 V347" class="ln" marker-end="url(#a)"/>
  <path d="M880 255 H922" class="ln" marker-end="url(#a)"/>
  <text x="884" y="242" class="lab">text, ts</text>

  <!-- ===== audio out (Jammy) ===== -->
  <text x="330" y="455" class="grp" fill="#0f8a7e">AUDIO OUT</text>
  <rect x="630" y="470" width="250" height="150" rx="14" class="audio"/>
  <text x="650" y="503" class="t">Piper TTS</text>
  <text x="650" y="529" class="s">Elderly persona voice</text>
  <text x="650" y="549" class="s">Hinglish → Devanagari</text>
  <text x="650" y="585" class="m">scripted lines cached</text>
  <text x="650" y="603" class="m">~240 ms live, 0 ms cached</text>

  <rect x="330" y="470" width="250" height="150" rx="14" class="audio"/>
  <text x="350" y="503" class="t">Playback queue</text>
  <text x="350" y="529" class="s">Persona audio to the line</text>
  <text x="350" y="549" class="s">Stops within 20 ms when</text>
  <text x="350" y="569" class="s">the caller interrupts</text>
  <text x="350" y="603" class="m">AudioSink</text>

  <path d="M930 545 H888" class="ln" marker-end="url(#a)"/>
  <text x="886" y="532" class="lab">reply</text>
  <path d="M630 545 H588" class="ln" marker-end="url(#a)"/>
  <path d="M330 545 H160 V333" class="ln" marker-end="url(#a)"/>
  <text x="172" y="530" class="lab">persona speaks</text>
  <path d="M455 325 V462" class="lg" marker-end="url(#ag)"/>
  <text x="465" y="400" class="lab" fill="#6e6e73">barge-in:</text>
  <text x="465" y="418" class="lab" fill="#6e6e73">cancel</text>

  <!-- ===== outputs ===== -->
  <text x="1360" y="168" class="grp" fill="#6e6e73">OUTPUTS</text>
  <rect x="1360" y="185" width="200" height="120" rx="14" class="out"/>
  <text x="1378" y="218" class="t">Live dashboard</text>
  <text x="1378" y="244" class="s">State, transcript,</text>
  <text x="1378" y="264" class="s">details, time spent</text>
  <text x="1378" y="290" class="m">WebSocket · SIMULATED</text>
  <path d="M1310 245 H1352" class="ln" marker-end="url(#a)"/>
  <text x="1314" y="232" class="lab">events</text>

  <rect x="1360" y="500" width="200" height="120" rx="14" class="out"/>
  <text x="1378" y="533" class="t">Report (JSON)</text>
  <text x="1378" y="559" class="s">Details, transcript,</text>
  <text x="1378" y="579" class="s">call metrics</text>
  <text x="1378" y="605" class="m">for manual review</text>
  <path d="M1310 560 H1352" class="ln" marker-end="url(#a)"/>

  <rect x="1300" y="700" width="260" height="120" rx="14" fill="#ffffff" stroke="#8e8e93" stroke-width="1.4"/>
  <text x="1318" y="730" class="t">A person reviews it</text>
  <text x="1318" y="756" class="s">and submits via helpline 1930,</text>
  <text x="1318" y="776" class="s">cybercrime.gov.in or Chakshu</text>
  <text x="1318" y="802" class="m">official channels</text>
  <path d="M1460 620 V692" class="lg" marker-end="url(#ag)"/>

  <!-- legend -->
  <rect x="40" y="760" width="18" height="18" rx="4" class="audio"/>
  <text x="68" y="774" class="s">Audio pipeline and dashboard</text>
  <rect x="300" y="760" width="18" height="18" rx="4" class="core"/>
  <text x="328" y="774" class="s">Persona core and extraction</text>
  <rect x="560" y="760" width="18" height="18" rx="4" class="out"/>
  <text x="588" y="774" class="s">Outputs</text>
  <text x="40" y="815" class="s">Laptop CPU measurement: caller hears a response 0.66 s after they stop talking (p50, fillers on). See docs/BENCHMARKS.md.</text>
  <text x="40" y="840" class="s">No hack-back, no probing of callers, nothing filed automatically. Demo sessions are labelled simulated.</text>
</svg>
